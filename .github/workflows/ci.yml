name: CI

# Catch typecheck / IPC-contract breakage on every push and PR, instead of at
# release time. test:smoke needs Electron and a display, so it isn't run here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: IPC contract check
        run: npm run test:ipc

      # The Android build runs the engine on node-sqlite3-wasm. Run the DB-backed
      # smoke tests against that driver here, where it's cheap to catch.
      - name: Core smoke tests on the WASM driver (Android)
        shell: bash
        env:
          CLOVER_DB_DRIVER: wasm
        run: |
          npm run test:reconcile
          npm run test:threads
          npm run test:notifications
          npm run test:announce
          npm run test:attach

      # The phone engine bundle (Phase 2): Electron-free, WASM driver, driven
      # through the message-channel bridge under Node.
      - name: Phone engine bridge
        run: npm run test:engine-bridge
