name: Spike Android (Phase 0)

# Throwaway Phase 0 feasibility spike (PLAN-mobile.md). Builds the diagnostic
# APK as a workflow artifact only — never attached to a GitHub release. Lives
# only on feat/android.
on:
  workflow_dispatch:
  push:
    branches: [feat/android]
    paths:
      - 'spike/**'
      - 'capacitor.config.ts'
      - 'android/**'
      - '.github/workflows/spike-android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install the Node project's dependencies
        run: npm install --prefix spike/node

      - name: Build the spike + sync
        run: npm run spike:sync

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Report APK size
        run: ls -la android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CloverMail-phase0-spike-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
