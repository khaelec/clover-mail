name: Release Linux

# Builds the Linux AppImage/deb on a Linux runner (native modules like
# better-sqlite3 must be built on the target OS) and attaches them to the
# GitHub release for the tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the Linux assets to
        required: true

permissions:
  contents: write

jobs:
  linux:
    # Only real version tags (vX.Y.Z). Pre-releases (e.g. the android-dev APK
    # host) must not trigger a desktop build.
    if: ${{ startsWith(github.event.release.tag_name || github.event.inputs.tag || '', 'v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main
        run: npm run build

      - name: Package Linux
        run: npx electron-builder --linux --publish never

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.electronjs.Electron2.BaseApp//23.08 \
            org.freedesktop.Sdk//23.08 \
            org.freedesktop.Platform//23.08

      - name: Package Flatpak
        run: npx electron-builder --linux flatpak --publish never

      - name: Attach Linux assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          shopt -s nullglob
          files=(release/CloverMail-*.AppImage release/CloverMail-*.deb release/CloverMail-*.flatpak release/latest-linux.yml)
          ls -la "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber
