name: Release Linux

# Builds the Linux AppImage/deb on a Linux runner (native modules like
# better-sqlite3 must be built on the target OS) and attaches them to the
# GitHub release for the tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the Linux assets to
        required: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main
        run: npm run build

      - name: Package Linux
        run: npx electron-builder --linux --publish never

      - name: Attach Linux assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          shopt -s nullglob
          files=(release/CloverMail-*.AppImage release/CloverMail-*.deb release/latest-linux.yml)
          ls -la "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber
