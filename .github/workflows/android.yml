name: Android

# Builds the standalone Android app (Capacitor WebView + nodejs-mobile engine),
# then publishes it to the `android-dev` pre-release together with a tiny
# `latest-android.json` the app polls to offer an in-app update. Signing uses the
# committed dev keystore, so installs go over the old app and keep user data.
on:
  push:
    branches: [feat/android, main]
    paths:
      - 'src/mobile/**'
      - 'src/core/**'
      - 'src/main/ipc/**'
      - 'src/renderer/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'vite.mobile.config.ts'
      - 'package.json'
      - 'scripts/android-e2e.sh'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build the engine + WebView UI
        run: |
          npm run mobile:engine
          npm run mobile:web

      - name: Sync the Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -PcloverVersion="$VERSION" --no-daemon

      - name: Publish the dev release (APK + update manifest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cat > latest-android.json <<EOF
          {"versionName":"$VERSION","url":"https://github.com/khaelec/clover-mail/releases/download/android-dev/app-debug.apk"}
          EOF
          gh release upload android-dev \
            android/app/build/outputs/apk/debug/app-debug.apk \
            latest-android.json --clobber
          ls -la android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CloverMail-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
