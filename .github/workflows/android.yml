name: Android

# Builds the Capacitor Android client and uploads a debug APK. The Android SDK
# is provided by the runner, so this works without a local Android install.
on:
  push:
    branches: [main, feat/android]
    paths:
      - 'src/renderer/**'
      - 'src/shared/**'
      - 'vite.mobile.config.ts'
      - 'capacitor.config.ts'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The ubuntu-latest runner already ships the Android SDK (ANDROID_HOME is
      # set), so no setup action is needed.

      - name: Install dependencies
        run: npm ci

      - name: Build mobile web assets + sync
        run: npm run mobile:sync

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CloverMail-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
