name: Android

# Builds the Android app (the Capacitor WebView + the nodejs-mobile engine) and
# uploads a debug APK artifact. The emulator end-to-end check lives in
# scripts/android-e2e.sh; the GitHub-hosted AVD is too resource-starved for
# nodejs-mobile (the WebView renderer crashes), so on-device verification is done
# on a real phone for now.
on:
  push:
    branches: [feat/android, main]
    paths:
      - 'src/mobile/**'
      - 'src/core/**'
      - 'src/main/ipc/**'
      - 'src/renderer/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'vite.mobile.config.ts'
      - 'package.json'
      - 'scripts/android-e2e.sh'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build the engine + WebView UI
        run: |
          npm run mobile:engine
          npm run mobile:web

      - name: Sync the Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Report APK size
        run: ls -la android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CloverMail-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
