name: Release Android

# Builds the Android client for a release and attaches the APK to it, so one
# release carries the Windows, Linux and Android artifacts. Without signing
# secrets it produces a debug APK (installable for testing); with them, a signed
# release APK. The runner provides the Android SDK.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the Android APK to
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build mobile web assets + sync
        run: npm run mobile:sync

      - name: Configure signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/clover.keystore
            cat > android/keystore.properties <<EOF
          storeFile=clover.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets — building a debug APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Name and attach the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          set -e
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            SRC=android/app/build/outputs/apk/release/app-release.apk
          else
            SRC=android/app/build/outputs/apk/debug/app-debug.apk
          fi
          OUT="CloverMail-${TAG#v}-android.apk"
          cp "$SRC" "$OUT"
          ls -la "$OUT"
          gh release upload "$TAG" "$OUT" --clobber
