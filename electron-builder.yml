appId: com.clovermail.app
productName: Clover Mail
copyright: Copyright © 2026 Clover Mail
artifactName: CloverMail-${version}-setup.${ext}
directories:
  output: release
  buildResources: build
# better-sqlite3 ships N-API prebuilds that work as-is; do not rebuild for Electron.
npmRebuild: false
files:
  - out/**
asarUnpack:
  - '**/*.node'
  - node_modules/better-sqlite3/**
extraResources:
  - from: THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
publish:
  provider: github
  owner: khaelec
  repo: clover-mail
