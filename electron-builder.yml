appId: com.clovermail.app
productName: Clover Mail
copyright: Copyright © 2026 CLOVERFIELD FARMS IT SERVICES
artifactName: CloverMail-${version}-setup.${ext}
directories:
  output: release
  buildResources: build
# better-sqlite3 ships N-API prebuilds that work as-is; do not rebuild for Electron.
npmRebuild: false
files:
  - out/**
asarUnpack:
  - '**/*.node'
  - node_modules/better-sqlite3/**
extraResources:
  - from: THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
linux:
  icon: build/icon.png
  category: Network
  synopsis: Fast, good-looking email client
  description: Clover Mail — a fast, good-looking email client with live wallpapers, custom apps, calendar/ICS, and an AI copilot.
  maintainer: CLOVERFIELD FARMS IT SERVICES <itservices@cloverfieldfarms.com>
  artifactName: CloverMail-${version}-${arch}.${ext}
  # Match the .desktop filename + StartupWMClass to Electron's app_id (from
  # desktopName) so desktop environments link the window to its icon.
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
# Built separately in CI (needs flatpak-builder + runtimes). Recommended for
# immutable systems like Fedora Kinoite, where the AppImage can't self-update.
flatpak:
  base: org.electronjs.Electron2.BaseApp
  baseVersion: '23.08'
  runtime: org.freedesktop.Platform
  runtimeVersion: '23.08'
  sdk: org.freedesktop.Sdk
  finishArgs:
    - --share=network
    - --socket=x11
    - --socket=wayland
    - --device=dri
    - --socket=pulseaudio
    - --talk-name=org.freedesktop.Notifications
    - --talk-name=org.freedesktop.secrets
    - --filesystem=xdg-download
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # HARD RULE: updates/uninstalls must never remove user data (accounts, mail cache,
  # attachments, settings live in %APPDATA%\Clover Mail and are preserved).
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: khaelec
  repo: clover-mail
