appId: com.clovermail.app
productName: Clover Mail
copyright: Copyright © 2026 Clover Mail
artifactName: CloverMail-${version}-setup.${ext}
directories:
  output: release-personal
  buildResources: build
npmRebuild: false
files:
  - out/**
asarUnpack:
  - '**/*.node'
  - node_modules/better-sqlite3/**
# Personal build = the public build + a bundled seed DB that is copied on first
# run ONLY (never overwrites existing data). It updates from the public feed.
extraResources:
  - from: seed/clover-mail.db
    to: seed.db
publish:
  provider: github
  owner: khaelec
  repo: clover-mail
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
